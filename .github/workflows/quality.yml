name: Quality Checks

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions: {}

jobs:
  lint:
    name: "Lint (Ruff)"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install requirements
        run: python3 -m pip install -r requirements.txt

      - name: Lint (ruff check)
        run: python3 -m ruff check .

      - name: Format (ruff format)
        run: python3 -m ruff format . --check

  tests:
    name: "Tests (Pytest, ${{ matrix.ha }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "HA 2026.11"
            requirements: "requirements.txt"
          - ha: "HA 2026.10"
            requirements: "requirements-ha-2026.10.txt"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "${{ matrix.requirements }}"

      - name: Install requirements
        run: python3 -m pip install -r "${{ matrix.requirements }}"

      - name: Run tests (pytest)
        run: python3 -m pytest -q

      - name: Set up Node
        if: matrix.requirements == 'requirements.txt'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run the card tests (node)
        if: matrix.requirements == 'requirements.txt'
        run: node --test "tests/frontend/*.test.mjs"
